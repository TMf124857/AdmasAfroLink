services:
  # AdmasAfroLink Frontend Development
  frontend-dev:
    container_name: admasafrolink-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=AdmasAfroLink
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_DEBUG_MODE=true
    networks:
      - admasafrolink
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
    labels:
      - "com.admasafrolink.service=frontend"
      - "com.admasafrolink.environment=development"

  # AdmasAfroLink Frontend Production
  frontend-prod:
    container_name: admasafrolink-frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
      - NEXT_PUBLIC_SOCKET_URL=http://backend:8000
      - NEXT_PUBLIC_APP_NAME=AdmasAfroLink
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_DEBUG_MODE=false
      - NEXT_PUBLIC_ENABLE_ANALYTICS=true
    networks:
      - admasafrolink
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - backend
      - redis
    profiles:
      - production
    labels:
      - "com.admasafrolink.service=frontend"
      - "com.admasafrolink.environment=production"

  # Backend API Service
  backend:
    container_name: admasafrolink-backend
    image: node:22-alpine
    working_dir: /app
    command: >
      sh -c "
        echo 'Backend service placeholder - Starting mock API server...';
        npm install -g json-server;
        echo '{
          \"students\": [],
          \"applications\": [],
          \"documents\": [],
          \"workflows\": [],
          \"notifications\": []
        }' > db.json;
        json-server --host 0.0.0.0 --port 8000 --watch db.json --routes routes.json
      "
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app
    environment:
      - NODE_ENV=production
      - PORT=8000
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=mongodb://mongo:27017/admasafrolink
    networks:
      - admasafrolink
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/students || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      - mongo
      - redis
    labels:
      - "com.admasafrolink.service=backend"
      - "com.admasafrolink.environment=production"

  # MongoDB Database
  mongo:
    container_name: admasafrolink-mongo
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admasafrolink2025
      - MONGO_INITDB_DATABASE=admasafrolink
    networks:
      - admasafrolink
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.admasafrolink.service=database"
      - "com.admasafrolink.environment=production"

  # Redis Cache
  redis:
    container_name: admasafrolink-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass admasafrolink2025
    networks:
      - admasafrolink
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.admasafrolink.service=cache"
      - "com.admasafrolink.environment=production"

  # Nginx Reverse Proxy
  nginx:
    container_name: admasafrolink-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - admasafrolink
    restart: unless-stopped
    depends_on:
      - frontend-prod
      - backend
    profiles:
      - production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.admasafrolink.service=proxy"
      - "com.admasafrolink.environment=production"

  # File Storage Service
  minio:
    container_name: admasafrolink-minio
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=admasafrolink
      - MINIO_ROOT_PASSWORD=admasafrolink2025
      - MINIO_DOMAIN=localhost
    command: server /data --console-address ":9001"
    networks:
      - admasafrolink
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - production
    labels:
      - "com.admasafrolink.service=storage"
      - "com.admasafrolink.environment=production"

networks:
  admasafrolink:
    driver: bridge
    name: admasafrolink-network
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  node_modules:
    name: admasafrolink-node-modules
  next_cache:
    name: admasafrolink-next-cache
  mongo_data:
    name: admasafrolink-mongo-data
  mongo_config:
    name: admasafrolink-mongo-config
  redis_data:
    name: admasafrolink-redis-data
  backend_data:
    name: admasafrolink-backend-data
  minio_data:
    name: admasafrolink-minio-data
  nginx_logs:
    name: admasafrolink-nginx-logs
