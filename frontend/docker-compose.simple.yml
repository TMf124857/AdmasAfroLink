# Simple Docker Compose for development
services:
  # AdmasAfroLink Frontend Development
  frontend-dev:
    container_name: admasafrolink-frontend-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8000
      - NEXT_PUBLIC_APP_NAME=AdmasAfroLink
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - NEXT_PUBLIC_DEBUG_MODE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache (optional for development)
  redis:
    container_name: admasafrolink-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass devpass123
    restart: unless-stopped
    profiles:
      - with-redis

volumes:
  node_modules:
    name: admasafrolink-node-modules
  next_cache:
    name: admasafrolink-next-cache
  redis_data:
    name: admasafrolink-redis-data
