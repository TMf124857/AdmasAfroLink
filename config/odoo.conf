[options]
# Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo123
db_name = odoo

# Server settings
http_port = 8069
longpolling_port = 8072

# Logging
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log

# Session and Security
session_store = redis
session_redis_host = redis
session_redis_port = 6379
session_redis_db = 0

# File paths
addons_path = /mnt/extra-addons,/mnt/enterprise-addons,/usr/lib/python3/dist-packages/odoo/addons

# Data directory
data_dir = /var/lib/odoo

# Workers configuration (for production)
workers = 2
max_cron_threads = 2

# Memory limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Admin password (change in production)
admin_passwd = admin123

# Database filter
dbfilter = ^odoo$

# Proxy mode (when using nginx)
proxy_mode = True

# Development mode (set to False in production)
dev_mode = True

# Email configuration (configure for production)
# email_from = noreply@yourcompany.com
# smtp_server = localhost
# smtp_port = 25
# smtp_user = 
# smtp_password = 
# smtp_ssl = False
