[options]
# Database settings  
db_host = db
db_port = 5432       
db_user = odoo       
db_password = odoo123
db_name = admasafrolink_uganda

# Server settings
http_port = 8069
gevent_port = 8072

# Logging
log_level = info
log_handler = :INFO
logfile = /var/log/odoo/odoo.log
syslog = False

# Session and Security
session_store = redis
session_redis_host = redis
session_redis_port = 6379
session_redis_db = 0

# File paths
addons_path = /mnt/extra-addons/enterprise,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

# Data directory
data_dir = /var/lib/odoo

# Workers configuration (optimized for Ubuntu server)
workers = 4
max_cron_threads = 2

# Memory limits (optimized for production)
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Admin password (change in production)
admin_passwd = admin123

# Database filter - Allow access to AdmasAfroLink database
dbfilter = ^admasafrolink_uganda$

# Proxy mode (when using nginx)
proxy_mode = True

# Production optimizations
without_demo = False

# Security settings - Enable database listing for setup
list_db = True

# Performance settings
transient_age_limit = 1.0

# AdmasAfroLink specific settings
# Company defaults
company_name = Admas AfroLink Limited
company_email = info@admasafrolink.com
company_website = https://admasafrolink.com
company_phone = +256-XXX-XXXXXX
company_street = 1st floor, suite 108, Kamure Park
company_street2 = plot 128 Old Kiira Road
company_city = Kampala
company_state = Central Region
company_zip = 
company_country = Uganda

