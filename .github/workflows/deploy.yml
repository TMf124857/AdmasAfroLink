name: Deploy AdmasAfroLink API

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '9.0.x'
  DOCKER_REGISTRY: admasafrolinkregistry.azurecr.io
  IMAGE_NAME: admasafrolink-api

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Application

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal

  build:
    runs-on: ubuntu-latest
    needs: test
    name: Build and Push Docker Image
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-azure:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to Azure
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'admasafrolink-api'
        slot-name: 'production'
        images: '${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest'

    - name: Run Database Migrations
      run: |
        az webapp ssh --resource-group admasafrolink-rg --name admasafrolink-api --command "dotnet ef database update"

  deploy-aws:
    runs-on: ubuntu-latest
    needs: build
    name: Deploy to AWS ECS
    if: github.ref == 'refs/heads/main' && false  # Disabled by default
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Deploy to ECS
      run: |
        aws ecs update-service --cluster admasafrolink-cluster --service admasafrolink-service --force-new-deployment

  deploy-render:
    runs-on: ubuntu-latest
    needs: test
    name: Deploy to Render
    if: github.ref == 'refs/heads/main' && false  # Disabled by default
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Render
      uses: bounceapp/render-action@0.6.0
      with:
        render-token: ${{ secrets.RENDER_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        service-id: ${{ secrets.RENDER_SERVICE_ID }}
        retries: 20
        wait: 16000
        sleep: 30000

  deploy-railway:
    runs-on: ubuntu-latest
    needs: test
    name: Deploy to Railway
    if: github.ref == 'refs/heads/main' && false  # Disabled by default
    environment: production

    steps:
    - uses: actions/checkout@v4

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway up --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-azure]
    name: Notify Deployment
    if: always() && github.ref == 'refs/heads/main'

    steps:
    - name: Notify Success
      if: needs.deploy-azure.result == 'success'
      run: |
        echo "✅ Deployment successful!"
        echo "🌍 Application URL: https://admasafrolink-api.azurewebsites.net"
        
    - name: Notify Failure
      if: needs.deploy-azure.result == 'failure'
      run: |
        echo "❌ Deployment failed!"
        echo "Check the logs for more details."
