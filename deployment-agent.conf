# Deployment Agent Configuration
# Update these values for your specific setup

# Server Configuration
SERVER_HOST="ubuntu-s-2vcpu-4gb-ams3-01"  # Your DigitalOcean droplet hostname or IP
SERVER_USER="ubuntu"
SERVER_PATH="/home/ubuntu/AdmasAfroLink"

# Repository Configuration
REPO_URL="https://github.com/TMf124857/AdmasAfroLink.git"
REPO_BRANCH="main"

# Deployment Configuration
DOCKER_COMPOSE_FILE="docker-compose.yml"
BACKUP_ENABLED=true
BACKUP_RETENTION_DAYS=7

# Testing Configuration
HEALTH_CHECK_URL="http://localhost:8069"
HEALTH_CHECK_TIMEOUT=300  # 5 minutes
STARTUP_WAIT_TIME=30      # 30 seconds

# Notification Configuration (optional)
SLACK_WEBHOOK=""
EMAIL_NOTIFICATIONS=false
NOTIFICATION_EMAIL=""

# Enterprise Configuration
ENTERPRISE_TARBALL="odoo_17.0+e.latest.tar.gz"
FALLBACK_TO_COMMUNITY=true
CREATE_SAMPLE_ENTERPRISE=true

# Logging Configuration
LOG_LEVEL="INFO"
LOG_FILE="deployment.log"
RETAIN_LOGS_DAYS=30
