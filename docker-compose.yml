version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: odoo_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - odoo_network

  # Odoo Enterprise
  odoo:
    image: odoo:17.0
    container_name: odoo_enterprise
    depends_on:
      - db
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo123}
      DB_NAME: ${POSTGRES_DB:-odoo}
    volumes:
      - odoo_web_data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons
      - ./enterprise:/mnt/enterprise-addons
      - ./logs:/var/log/odoo
    ports:
      - "8069:8069"
      - "8072:8072"  # For longpolling
    restart: unless-stopped
    networks:
      - odoo_network
    command: ["odoo", "--config=/etc/odoo/odoo.conf"]

  # Redis (for session storage and caching)
  redis:
    image: redis:7-alpine
    container_name: odoo_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - odoo_network

  # pgAdmin (Database Administration Tool)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odoo_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    restart: unless-stopped
    networks:
      - odoo_network
    profiles:
      - tools

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: odoo_nginx
    depends_on:
      - odoo
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - odoo_network
    profiles:
      - proxy

volumes:
  postgres_data:
    driver: local
  odoo_web_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  odoo_network:
    driver: point
