user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Upstream definitions
    upstream odoo {
        server odoo:8069;
        keepalive 32;
    }

    upstream odoochat {
        server odoo:8072;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_zone $server_name zone=perserver:10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/xhtml+xml
        application/javascript
        application/json
        application/pdf
        application/postscript
        application/rtf
        application/msword
        application/vnd.ms-excel
        application/vnd.ms-powerpoint
        application/vnd.oasisopendocument.text
        application/vnd.oasisopendocument.spreadsheet
        application/vnd.oasisopendocument.presentation
        application/vnd.oasisopendocument.graphics
        application/vnd.oasisopendocument.chart
        application/vnd.oasisopendocument.formula
        application/vnd.oasisopendocument.database
        application/vnd.oasisopendocument.image
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: blob:; font-src 'self' data:;" always;

    # SSL Configuration (uncomment for HTTPS)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    server {
        listen 80;
        server_name localhost;
        
        # Redirect to HTTPS in production
        # return 301 https://$server_name$request_uri;

        # Connection and rate limiting
        limit_conn perip 10;
        limit_conn perserver 100;
        limit_req zone=general burst=20 nodelay;

        # Proxy settings
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        # Client settings
        client_max_body_size 50M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # Hide server version
        server_tokens off;

        # Security: Block common attack patterns
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Block access to sensitive files
        location ~* \.(conf|htaccess|htpasswd|ini|log|sh|sql|bak|swp)$ {
            deny all;
            access_log off;
            log_not_found off;
        }

        # Longpolling requests
        location /longpolling {
            proxy_pass http://odoochat;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;
        }

        # Rate limiting for login
        location ~ ^/web/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://odoo;
        }

        # Rate limiting for reset password
        location ~ ^/web/reset_password {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://odoo;
        }

        # API rate limiting
        location ~ ^/api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://odoo;
        }

        # XML-RPC/JSON-RPC endpoints
        location ~ ^/(xmlrpc|jsonrpc) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://odoo;
        }

        # Static files caching and optimization
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://odoo;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            
            # Enable compression for static files
            gzip_static on;
        }

        # Main application
        location / {
            proxy_pass http://odoo;
            proxy_buffering off;
            proxy_redirect off;
        }

        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Block xmlrpc for security (uncomment if not needed)
        # location ~ ^/xmlrpc {
        #     deny all;
        #     return 403;
        # }
    }

    # HTTPS server configuration (uncomment for production with SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # Include all location blocks from HTTP server above
    #     # ... (copy from above)
    # }

    # Security: Block requests with no Host header
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
